<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Vault Plus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-container {
            background: #18191a;
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding: 25px;
            text-align: center;
            border: 6px solid #f1c40f;
            position: relative;
        }

        h1 {
            color: #f1c40f;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #d35400;
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .subtitle {
            font-size: 1rem;
            color: #bdc3c7;
            margin-bottom: 15px;
        }

        /* Top HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #242526;
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #3a3b3c;
        }

        .streak-badge {
            color: #ff9f43;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.2rem;
        }

        .streak-badge.on-fire {
            animation: firePulse 0.4s infinite alternate;
        }

        @keyframes firePulse {
            from { transform: scale(1); filter: drop-shadow(0 0 2px #ff4757); }
            to { transform: scale(1.12); filter: drop-shadow(0 0 8px #ff4757); }
        }

        /* Coin Transfer Stage */
        .transfer-stage {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #242526;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 2px dashed #474849;
            position: relative;
        }

        .coin-pool {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 45%;
        }

        .coin {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #f1c40f, #d4ac0d);
            border: 2px solid #b7950b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #7d6608;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
        }

        .coin.spent {
            opacity: 0.15;
            transform: scale(0.5);
            filter: grayscale(80%);
        }

        /* Flying Coin Animation */
        .flying-coin {
            position: fixed;
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #f1c40f, #d4ac0d);
            border: 2px solid #b7950b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #7d6608;
            box-shadow: 0 0 15px #f1c40f;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .vault-dropzone {
            width: 45%;
            background: #2f3031;
            border: 4px solid #f1c40f;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95px;
            position: relative;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
        }

        .vault-graphic {
            font-size: 2.5rem;
            color: #f1c40f;
            transition: transform 0.3s ease;
        }

        .vault-graphic.shake {
            animation: vaultShake 0.4s ease-in-out;
        }

        @keyframes vaultShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-6px) rotate(-8deg); }
            75% { transform: translateX(6px) rotate(8deg); }
        }

        .vault-label {
            font-size: 0.85rem;
            color: #f1c40f;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Arcade Announcement Banner */
        .arcade-banner {
            background: linear-gradient(135deg, #2c3e50, #f39c12);
            color: #ffffff;
            padding: 10px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.3);
            border: 2px solid #f1c40f;
            animation: bannerPulse 0.6s infinite alternate;
            display: none;
        }

        @keyframes bannerPulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        /* Problem Card (Equation) */
        .problem-card {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2), 0 6px 15px rgba(0,0,0,0.3);
            border: 4px solid #a29bfe;
            animation: cardFloat 2.5s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #a04000, 0 10px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #a04000, 0 12px 20px rgba(0,0,0,0.4);
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a04000, 0 4px 8px rgba(0,0,0,0.2);
        }

        .option-btn.shake-wrong {
            animation: buttonShake 0.4s ease-in-out;
            background: linear-gradient(135deg, #eb4d4b, #c0392b) !important;
            box-shadow: 0 6px 0 #962d22 !important;
        }

        @keyframes buttonShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .message {
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 35px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none !important;
        }

        .restart-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
            margin-top: 15px;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #1e8449, 0 12px 25px rgba(0,0,0,0.4);
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e8449, 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Math Vault Plus</h1>
        <div class="subtitle">1st Grade Edition • 10 Vault Codes</div>

        <div id="game-screen">
            <!-- HUD -->
            <div class="hud">
                <div>Equation: <span id="current-eq-num">1</span>/10</div>
                <div class="streak-badge" id="streak-badge">🔥 Streak: <span id="streak-count">0</span></div>
            </div>

            <!-- Arcade Announcement Banner -->
            <div id="arcade-banner" class="arcade-banner"></div>

            <!-- Coin Transfer Stage -->
            <div class="transfer-stage">
                <div class="coin-pool" id="coin-pool">
                    <!-- 10 Coins Injected -->
                </div>
                <div class="vault-dropzone" id="vault-dropzone">
                    <div class="vault-graphic" id="vault-icon">🏦</div>
                    <div class="vault-label">Bank Deposit</div>
                </div>
            </div>

            <!-- Problem Card -->
            <div class="problem-card" id="problem-text">1 + 1</div>

            <!-- Options Grid -->
            <div class="options-grid" id="options-container"></div>

            <div class="message" id="message"></div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="hidden">
            <div class="vault-graphic" style="font-size: 4.5rem; margin-bottom: 15px; animation: floatTitle 2s infinite;">💰🎉🏆</div>
            <h2 style="color: #2ecc71; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);">Vault Fully Unlocked!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 25px; color: #ecf0f1; line-height: 1.4;">Incredible job! You mastered all 10 math equations like a true 1st grade math superstar!</p>
            <button class="restart-btn" onclick="startGame()">Play Again 🚀</button>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.18);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'land') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.setValueAtTime(90, now + 0.12);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.start(now);
                osc.stop(now + 0.28);
            } else if (type === 'win') {
                let notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    let noteOsc = audioCtx.createOscillator();
                    let noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    noteGain.gain.setValueAtTime(0.22, now + idx * 0.12);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.35);
                    noteOsc.start(now + idx * 0.12);
                    noteOsc.stop(now + idx * 0.12 + 0.35);
                });
            }
        }

        let currentIndex = 0;
        let streak = 0;
        let currentAnswer = 0;
        let currentNum1 = 0;
        let currentNum2 = 0;
        let isProcessing = false;

        const problemText = document.getElementById('problem-text');
        const optionsContainer = document.getElementById('options-container');
        const eqNumDisplay = document.getElementById('current-eq-num');
        const streakDisplay = document.getElementById('streak-count');
        const streakBadge = document.getElementById('streak-badge');
        const messageDisplay = document.getElementById('message');
        const gameScreen = document.getElementById('game-screen');
        const winScreen = document.getElementById('win-screen');
        const vaultIcon = document.getElementById('vault-icon');
        const coinPool = document.getElementById('coin-pool');
        const vaultDropzone = document.getElementById('vault-dropzone');
        const arcadeBanner = document.getElementById('arcade-banner');

        function renderCoins() {
            coinPool.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                if (i < currentIndex) {
                    coin.classList.add('spent');
                }
                coin.textContent = i + 1;
                coinPool.appendChild(coin);
            }
        }

        function startGame() {
            currentIndex = 0;
            streak = 0;
            streakDisplay.textContent = streak;
            streakBadge.classList.remove('on-fire');
            gameScreen.classList.remove('hidden');
            winScreen.classList.add('hidden');
            arcadeBanner.style.display = 'none';
            vaultIcon.textContent = '🏦';
            renderCoins();
            nextQuestion();
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function nextQuestion() {
            isProcessing = false;
            messageDisplay.textContent = '';
            vaultIcon.textContent = '🏦';
            eqNumDisplay.textContent = currentIndex + 1;
            renderCoins();

            // Handle Banners
            if (currentIndex === 4) {
                arcadeBanner.textContent = '⭐ HALF WAY THERE! KEEP CRUSHING IT! ⭐';
                arcadeBanner.style.display = 'block';
            } else if (currentIndex === 9) {
                arcadeBanner.textContent = '⚡ FINAL VAULT CODE! UNLOCK THE BANK! ⚡';
                arcadeBanner.style.display = 'block';
            } else {
                arcadeBanner.style.display = 'none';
            }

            // Advanced 1st Grade 2/3 School Year Progression (Addition Only)
            if (currentIndex < 2) {
                currentNum1 = getRandomInt(3, 6);
                currentNum2 = getRandomInt(3, 4);
            } else if (currentIndex < 8) {
                currentNum1 = getRandomInt(5, 8);
                currentNum2 = getRandomInt(5, 7);
            } else {
                currentNum1 = getRandomInt(7, 9);
                currentNum2 = getRandomInt(8, 9);
            }

            currentAnswer = currentNum1 + currentNum2;
            problemText.textContent = `${currentNum1} + ${currentNum2}`;

            // Generate options close to the real answer to prevent easy guessing
            let options = [currentAnswer];
            while (options.length < 4) {
                let offset = getRandomInt(-3, 3);
                let wrong = currentAnswer + offset;
                if (wrong >= 0 && wrong !== currentAnswer && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function triggerPhysicalCoinFlight(callback) {
            const coins = coinPool.querySelectorAll('.coin');
            const targetCoin = coins[currentIndex];
            if (!targetCoin) {
                callback();
                return;
            }

            const startRect = targetCoin.getBoundingClientRect();
            const targetRect = vaultDropzone.getBoundingClientRect();

            const flyer = document.createElement('div');
            flyer.className = 'flying-coin';
            flyer.textContent = currentIndex + 1;
            flyer.style.left = `${startRect.left}px`;
            flyer.style.top = `${startRect.top}px`;
            document.body.appendChild(flyer);

            targetCoin.classList.add('spent');
            flyer.getBoundingClientRect();

            flyer.style.left = `${targetRect.left + (targetRect.width / 2) - 17}px`;
            flyer.style.top = `${targetRect.top + (targetRect.height / 2) - 17}px`;
            flyer.style.transform = 'scale(1.2) rotate(360deg)';

            setTimeout(() => {
                flyer.remove();
                playSound('land');
                vaultIcon.textContent = '🏦';
                vaultIcon.classList.add('shake');
                setTimeout(() => vaultIcon.classList.remove('shake'), 400);
                callback();
            }, 800);
        }

        function checkAnswer(selected, btn) {
            if (isProcessing) return;
            isProcessing = true;

            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === currentAnswer) {
                playSound('correct');
                streak++;
                streakDisplay.textContent = streak;
                if (streak >= 3) {
                    streakBadge.classList.add('on-fire');
                }
                
                // Display full equation with answer for review (e.g. 4+5=9)
                problemText.textContent = `${currentNum1} + ${currentNum2} = ${currentAnswer}`;
                
                messageDisplay.style.color = '#2ecc71';
                messageDisplay.textContent = '✨ Correct! Deposited into Bank! ✨';
                btn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
                btn.style.boxShadow = '0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.3)';

                triggerPhysicalCoinFlight(() => {
                    currentIndex++;

                    if (currentIndex >= 10) {
                        playSound('win');
                        setTimeout(() => {
                            gameScreen.classList.add('hidden');
                            winScreen.classList.remove('hidden');
                        }, 1500);
                        return;
                    }

                    setTimeout(nextQuestion, 3000);
                });
            } else {
                playSound('incorrect');
                streak = 0;
                streakDisplay.textContent = streak;
                streakBadge.classList.remove('on-fire');
                
                messageDisplay.style.color = '#ff4757';
                messageDisplay.textContent = '❌ Try again!';
                btn.classList.add('shake-wrong');
                
                setTimeout(() => {
                    isProcessing = false;
                    btn.classList.remove('shake-wrong');
                    btn.style.background = 'linear-gradient(135deg, #e67e22, #d35400)';
                    btn.style.boxShadow = '0 6px 0 #a04000, 0 10px 15px rgba(0,0,0,0.3)';
                    messageDisplay.textContent = '';
                    allButtons.forEach(b => b.style.pointerEvents = 'auto');
                }, 800);
            }
        }

        startGame();
    </script>
</body>
</html>
